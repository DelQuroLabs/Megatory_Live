name: Deploy VetCount web preview

on:
  push:
    branches: [main, arena/01a0b1e7-megatory-live]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Verify
        run: npm run typecheck && npm test -- --runInBand
      - name: Export web app
        env:
          EXPO_PUBLIC_API_BASE_URL: ${{ vars.VETCOUNT_API_BASE_URL || 'https://megatory-live.delqurolabs.app/api' }}
        run: npm run build:web
      - name: SPA fallback
        run: cp dist/index.html dist/404.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
